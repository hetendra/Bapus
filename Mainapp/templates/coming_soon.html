{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coming Soon - Bapus</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      min-height: 100vh;
      background: #ffffff;
    }

    .left {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      text-align: center;
      border-right: 1px solid #e2e8f0;
    }

    .right {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      background: #fafafa;
    }

    .logo {
      width: 320px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 2.5rem;
      color: #9b1c1c;
      letter-spacing: 3px;
    }

    .launch-date {
      margin: 10px 0 20px;
      color: #9b1c1c;
    }

    .countdown {
      display: flex;
      gap: 12px;
    }

    .countdown-box {
      background: #f1f5f9;
      padding: 10px;
      border-radius: 10px;
      min-width: 70px;
      text-align: center;
    }

    .countdown-box span {
      display: block;
      text-align: center;
    }

    .countdown-number {
      font-size: 1.8rem;
      font-weight: bold;
      color: #9b1c1c;
    }

    .countdown-label {
      font-size: 0.75rem;
      color: #64748b;
    }

    .form-section {
      width: 100%;
      max-width: 450px;
    }

    .form-section h2 {
      text-align: center;
      color: #9b1c1c;
      margin-bottom: 5px;
    }

    .form-section p {
      text-align: center;
      color: #64748b;
      margin-bottom: 20px;
    }

    .form-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .form-group {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 4px;
    }

    .form-group input,
    .form-group textarea {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      font-size: 14px;
      width: 100%;
    }

    .form-group textarea {
      height: 80px;
      resize: none;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #9b1c1c;
      outline: none;
    }

    .consent-box {
      display: flex;
      gap: 8px;
      background: #fff7f7;
      border: 1px solid #fecaca;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      color: #64748b;
      margin-bottom: 12px;
    }

    .consent-box input {
      margin-top: 3px;
      accent-color: #9b1c1c;
      flex-shrink: 0;
    }

    .consent-box strong {
      color: #9b1c1c;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #9b1c1c;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: #7f1d1d;
    }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      .left {
        border-right: none;
        border-bottom: 1px solid #e2e8f0;
      }
      .form-row {
        flex-direction: column;
      }
      .logo {
        width: 240px;
      }
    }
  </style>
</head>

<body>

  <!-- LEFT -->
  <div class="left">
    <img src="{% static 'bapus.png' %}" class="logo" alt="Bapus Logo" />
    <h1>Coming Soon</h1>
    <p class="launch-date">Launching on Vaishakh Purnima — 1st May 2026</p>
    <div class="countdown">
      <div class="countdown-box">
        <span class="countdown-number" id="days">00</span>
        <span class="countdown-label">Days</span>
      </div>
      <div class="countdown-box">
        <span class="countdown-number" id="hours">00</span>
        <span class="countdown-label">Hours</span>
      </div>
      <div class="countdown-box">
        <span class="countdown-number" id="minutes">00</span>
        <span class="countdown-label">Minutes</span>
      </div>
      <div class="countdown-box">
        <span class="countdown-number" id="seconds">00</span>
        <span class="countdown-label">Seconds</span>
      </div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <div class="form-section">
      <h2>Register Your Franchise Interest</h2>
      <p>Be the first to know when we launch. Submit your interest below.</p>

      <form action="https://formspree.io/f/mojypzbz" method="POST">

        <div class="form-row">
          <div class="form-group">
            <label>Full Name *</label>
            <input type="text" name="full_name" placeholder="Your full name" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Email Address *</label>
            <input type="email" name="email" placeholder="your@email.com" required />
          </div>
          <div class="form-group">
            <label>Phone Number *</label>
            <input type="tel" name="phone" placeholder="+91 XXXXX XXXXX" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>City *</label>
            <input type="text" name="city" placeholder="Your city" required />
          </div>
          <div class="form-group">
            <label>State *</label>
            <input type="text" name="state" placeholder="Your state" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Additional Comments</label>
            <textarea name="remarks" placeholder="Any questions or comments about the franchise..."></textarea>
          </div>
        </div>

        <div class="consent-box">
          <input type="checkbox" id="consent" name="consent" required />
          <label for="consent">
            I understand that this is a <strong>non-binding expression of interest</strong> for taking a franchise of <strong>Bapu's Rotlo</strong>. This submission is a soft commitment and not a legal agreement of any kind.
          </label>
        </div>

        <button type="submit" class="submit-btn">Submit Franchise Interest</button>

      </form>
    </div>
  </div>

  <script>
    const launchDate = new Date('2026-05-01T00:00:00').getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const diff = launchDate - now;

      if (diff <= 0) {
        document.getElementById('days').textContent = '00';
        document.getElementById('hours').textContent = '00';
        document.getElementById('minutes').textContent = '00';
        document.getElementById('seconds').textContent = '00';
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = String(days).padStart(2, '0');
      document.getElementById('hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>

</body>
</html>
